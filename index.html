<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Takkee English Ver.1.0</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#17243b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:24px 18px 60px}.brand{font-size:13px;font-weight:800;letter-spacing:.13em;color:#3666c8}.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 24px}h1{font-size:29px;margin:0;letter-spacing:-.04em}.version{font-size:12px;color:#75839a}.panel{background:white;border:1px solid #e6eaf2;border-radius:22px;padding:22px;box-shadow:0 8px 24px #2034560a;margin-bottom:16px}.eyebrow{font-size:12px;font-weight:750;color:#4e74b9;letter-spacing:.08em;margin-bottom:12px}select{width:100%;padding:13px 14px;border:1px solid #d8dfeb;border-radius:12px;background:#fff;color:#1a2a44;font-size:16px}.count{font-size:13px;color:#738198;margin:0 0 10px}.english{font-size:29px;font-weight:750;line-height:1.35;margin:8px 0 20px;overflow-wrap:anywhere}.japanese{font-size:17px;color:#43536a;min-height:28px;margin:0 0 20px}.hidden-text{color:#9aa7b8;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{cursor:pointer;touch-action:manipulation;border:0;border-radius:13px;padding:13px 15px;font-size:15px;font-weight:700;background:#eaf0fc;color:#244d96}button.primary{background:#2862d8;color:white;flex:1}button.secondary{flex:1}button:disabled{opacity:.45}.speedrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;color:#566780;font-size:14px}.speedrow select{width:145px;padding:9px}.nav{display:flex;gap:10px;margin-top:16px}.nav button{flex:1}.note{color:#78869b;font-size:12px;line-height:1.7;margin:18px 4px}footer{text-align:center;color:#8a96a8;font-size:12px;margin-top:25px}
</style>
</head>
<body><main>
<div class="brand">TAKKEE ENGLISH</div><div class="top"><h1>英会話レッスン</h1><span class="version">Ver.1.0</span></div>
<section class="panel"><div class="eyebrow">LESSON SELECT</div><label for="lesson">練習する場面を選ぶ</label><select id="lesson"><option value="greeting">あいさつ</option><option value="travel">海外旅行</option><option value="cafe">カフェ・注文</option><option value="daily">日常会話</option></select></section>
<section class="panel"><div class="eyebrow">SPEAK & LISTEN</div><p id="count" class="count"></p><p id="english" class="english"></p><p id="japanese" class="japanese"></p><div class="actions"><button class="primary" id="speak">▶ 英語を聞く</button><button class="secondary" id="translation">日本語を隠す</button></div><div class="speedrow"><label for="speed">読み上げ速度</label><select id="speed"><option value="0.7">ゆっくり</option><option value="0.9" selected>ふつう</option><option value="1.1">少し速い</option></select></div><div class="nav"><button id="prev">← 前の英文</button><button id="next">次の英文 →</button></div></section>
<p class="note">英語を聞いて、声に出して真似してみましょう。音声は端末の読み上げ機能を利用します。iPhoneの音声設定やブラウザによって声や再生結果が異なります。</p><footer>Takkee English · First Prototype</footer>
</main><script>
'use strict';
const lessons={
 greeting:[['Hello!','こんにちは！'],['How are you?','お元気ですか？'],["I'm fine, thank you.",'元気です。ありがとう。'],['Nice to meet you.','はじめまして。'],['See you later!','また後で！']],
 travel:[['Where is the station?','駅はどこですか？'],['I have a reservation.','予約しています。'],['Could you help me?','手伝っていただけますか？'],['How much is this?','これはいくらですか？'],['Thank you for your help.','助けてくれてありがとうございます。']],
 cafe:[['Can I have a coffee, please?','コーヒーを一杯お願いします。'],['Do you have a menu?','メニューはありますか？'],['I would like this one.','これをお願いします。'],['For here, please.','店内でお願いします。'],['Can I have the bill, please?','お会計をお願いします。']],
 daily:[['What do you do on weekends?','週末は何をしますか？'],['I like listening to music.','音楽を聴くのが好きです。'],['What time is it?','今何時ですか？'],["I'm learning English.",'英語を勉強しています。'],['Have a great day!','良い一日を！']]
};
const $=id=>document.getElementById(id);let index=0,showTranslation=true;
function stop(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function render(){const items=lessons[$('lesson').value];$('count').textContent=`${index+1} / ${items.length}`;$('english').textContent=items[index][0];$('japanese').textContent=showTranslation?items[index][1]:'日本語訳を非表示にしています';$('japanese').classList.toggle('hidden-text',!showTranslation);$('translation').textContent=showTranslation?'日本語を隠す':'日本語を表示';$('prev').disabled=index===0;$('next').disabled=index===items.length-1}
$('lesson').addEventListener('change',()=>{stop();index=0;render()});$('translation').addEventListener('click',()=>{showTranslation=!showTranslation;render()});$('prev').addEventListener('click',()=>{if(index>0){stop();index--;render()}});$('next').addEventListener('click',()=>{if(index<lessons[$('lesson').value].length-1){stop();index++;render()}});
$('speak').addEventListener('click',()=>{if(!('speechSynthesis' in window)){alert('このブラウザでは音声読み上げを利用できません。');return}stop();const u=new SpeechSynthesisUtterance(lessons[$('lesson').value][index][0]);u.lang='en-US';u.rate=Number($('speed').value);u.pitch=1;window.speechSynthesis.speak(u)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
</script></body></html>
